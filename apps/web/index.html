<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VexPanel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--surface:#0f0f12;--card:#18181b;--card-hover:#1f1f23;--border:#27272a;--border-light:#3f3f46;--text:#fafafa;--text-secondary:#a1a1aa;--text-muted:#71717a;--accent:#8b5cf6;--accent-hover:#7c3aed;--accent-glow:rgba(139,92,246,0.15);--accent-glow-strong:rgba(139,92,246,0.3);--green:#22c55e;--green-bg:rgba(34,197,94,0.1);--red:#ef4444;--red-bg:rgba(239,68,68,0.1);--yellow:#eab308;--yellow-bg:rgba(234,179,8,0.1);--blue:#3b82f6;--blue-bg:rgba(59,130,246,0.1);--radius:12px;--radius-lg:16px;--radius-xl:20px;--shadow:0 1px 3px rgba(0,0,0,0.3),0 1px 2px rgba(0,0,0,0.2);--shadow-lg:0 10px 30px rgba(0,0,0,0.4);--transition:all 0.2s cubic-bezier(0.4,0,0.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-light)}

/* Login Page */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.login-page::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);top:-200px;right:-200px;pointer-events:none}
.login-page::after{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);bottom:-100px;left:-100px;pointer-events:none}
.login-container{width:100%;max-width:420px;padding:20px;position:relative;z-index:1}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:40px;box-shadow:var(--shadow-lg)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo h1{font-size:32px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#fff 0%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-logo p{color:var(--text-muted);font-size:13px;margin-top:8px}
.login-form{display:flex;flex-direction:column;gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px}
.form-group input{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;color:var(--text);font-size:14px;font-family:inherit;transition:var(--transition);outline:none}
.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.form-group input::placeholder{color:var(--text-muted)}
.login-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:14px;font-size:14px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:inherit;margin-top:8px}
.login-btn:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 4px 12px var(--accent-glow-strong)}
.login-btn:active{transform:translateY(0)}
.login-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.login-divider{display:flex;align-items:center;gap:12px;margin:4px 0}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.login-divider span{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.login-social{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-size:14px;font-weight:500;cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:10px;color:var(--text);font-family:inherit;width:100%}
.login-social:hover{background:var(--card-hover);border-color:var(--border-light)}
.login-footer{text-align:center;margin-top:24px;font-size:13px;color:var(--text-muted)}
.login-footer a{color:var(--accent);text-decoration:none}
.login-footer a:hover{text-decoration:underline}
.login-error{background:var(--red-bg);border:1px solid rgba(239,68,68,0.3);border-radius:var(--radius);padding:12px;color:var(--red);font-size:13px;display:none}
.login-error.show{display:block}

/* App Layout */
.app-layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:24px}
.sidebar-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#6d28d9);border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff}
.sidebar-logo-text{font-size:18px;font-weight:700;letter-spacing:-0.5px}
.sidebar-logo-text span{color:var(--accent)}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:2px}
.sidebar-section{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.2px;padding:16px 12px 8px;margin-top:8px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text-secondary);text-decoration:none;font-size:13px;font-weight:500;cursor:pointer;transition:var(--transition)}
.sidebar-item:hover{background:var(--card);color:var(--text)}
.sidebar-item.active{background:var(--accent-glow);color:var(--accent)}
.sidebar-item .icon{width:18px;text-align:center;font-size:14px}
.sidebar-item .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:600}
.sidebar-user{border-top:1px solid var(--border);padding:16px 12px;display:flex;align-items:center;gap:10px;margin-top:auto}
.sidebar-avatar{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#6d28d9);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.sidebar-user-info{flex:1;min-width:0}
.sidebar-user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-role{font-size:11px;color:var(--text-muted)}
.sidebar-logout{color:var(--text-muted);cursor:pointer;padding:6px;border-radius:6px;transition:var(--transition)}
.sidebar-logout:hover{background:var(--red-bg);color:var(--red)}

/* Main Content */
.main-content{padding:28px 32px;max-width:1400px}
.page-header{margin-bottom:28px}
.page-header h1{font-size:24px;font-weight:700;letter-spacing:-0.5px}
.page-header p{color:var(--text-muted);font-size:13px;margin-top:4px}

/* Stats Cards */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;transition:var(--transition)}
.stat-card:hover{border-color:var(--border-light);transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-card .stat-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;margin-bottom:12px}
.stat-card .stat-icon.purple{background:var(--accent-glow);color:var(--accent)}
.stat-card .stat-icon.green{background:var(--green-bg);color:var(--green)}
.stat-card .stat-icon.red{background:var(--red-bg);color:var(--red)}
.stat-card .stat-icon.yellow{background:var(--yellow-bg);color:var(--yellow)}
.stat-card .stat-icon.blue{background:var(--blue-bg);color:var(--blue)}
.stat-card .stat-value{font-size:28px;font-weight:700;letter-spacing:-1px}
.stat-card .stat-label{font-size:12px;color:var(--text-muted);margin-top:4px;font-weight:500}

/* Cards & Tables */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.card-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}
.card-header h2{font-size:15px;font-weight:600}
.card-body{padding:0}
.card-body.padded{padding:20px}

.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.table td{padding:14px 16px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tbody tr{transition:var(--transition)}
.table tbody tr:hover{background:var(--card-hover)}
.table tbody tr:last-child td{border-bottom:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:var(--transition);border:none;font-family:inherit;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);box-shadow:0 4px 12px var(--accent-glow-strong)}
.btn-secondary{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn-secondary:hover{border-color:var(--border-light);background:var(--card-hover)}
.btn-danger{background:var(--red-bg);border:1px solid rgba(239,68,68,0.2);color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:8px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.2px}
.badge-running{background:var(--green-bg);color:var(--green)}
.badge-stopped{background:var(--red-bg);color:var(--red)}
.badge-provisioning{background:var(--yellow-bg);color:var(--yellow)}
.badge-suspended{background:var(--yellow-bg);color:var(--yellow)}
.badge-error{background:var(--red-bg);color:var(--red)}
.badge-online{background:var(--green-bg);color:var(--green)}
.badge-offline{background:var(--red-bg);color:var(--red)}
.badge-maintenance{background:var(--yellow-bg);color:var(--yellow)}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

/* VPS Card */
.vps-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;cursor:pointer;transition:var(--transition)}
.vps-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,0.3)}
.vps-card-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:16px}
.vps-card-name{font-size:15px;font-weight:600}
.vps-card-specs{display:flex;gap:16px;margin-bottom:16px}
.vps-card-spec{display:flex;flex-direction:column;gap:2px}
.vps-card-spec-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px}
.vps-card-spec-value{font-size:13px;font-weight:600}
.vps-card-footer{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border)}
.vps-card-ip{font-size:12px;color:var(--text-muted);font-family:monospace}

/* Progress Bar */
.progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width 0.3s}
.progress-fill.green{background:var(--green)}
.progress-fill.purple{background:var(--accent)}
.progress-fill.yellow{background:var(--yellow)}
.progress-fill.red{background:var(--red)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:28px;max-width:500px;width:90%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal h2{font-size:18px;font-weight:700;margin-bottom:4px}
.modal p{color:var(--text-muted);font-size:13px;margin-bottom:20px}
.modal-form{display:flex;flex-direction:column;gap:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px;font-size:13px;transform:translateY(80px);opacity:0;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);z-index:2000;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:rgba(34,197,94,0.3);background:var(--green-bg)}
.toast.error{border-color:rgba(239,68,68,0.3);background:var(--red-bg)}

/* Empty State */
.empty-state{text-align:center;padding:48px 20px}
.empty-state-icon{font-size:48px;margin-bottom:16px;opacity:0.5}
.empty-state h3{font-size:16px;font-weight:600;margin-bottom:8px}
.empty-state p{color:var(--text-muted);font-size:13px;max-width:300px;margin:0 auto}

/* Responsive */
@media(max-width:768px){
.app-layout{grid-template-columns:1fr}
.sidebar{display:none}
.main-content{padding:16px}
.stats-grid{grid-template-columns:repeat(2,1fr)}
.grid-2,.grid-3{grid-template-columns:1fr}
}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeIn 0.3s ease forwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.pulse{animation:pulse 2s infinite}
</style>
</head>
<body>

<!-- Login Page -->
<div id="loginPage" class="login-page" style="display:none">
<div class="login-container">
<div class="login-card">
<div class="login-logo">
<h1>VexPanel</h1>
<p>The Complete VPS Hosting Control Panel</p>
</div>
<div id="loginError" class="login-error"></div>
<form class="login-form" id="loginForm">
<div class="form-group">
<label>Email</label>
<input type="email" name="email" placeholder="admin@vexpanel.local" required autocomplete="email">
</div>
<div class="form-group">
<label>Password</label>
<input type="password" name="password" placeholder="Enter your password" required minlength="12" autocomplete="current-password">
</div>
<button type="submit" class="login-btn" id="loginBtn">Sign In</button>
<div class="login-divider"><span>or</span></div>
<button type="button" class="login-social" onclick="window.location.href='/api/auth/discord'">
<svg width="20" height="15" viewBox="0 0 71 55" fill="none"><path d="M60.1 4.9A58.5 58.5 0 0045.4.2a.2.2 0 00-.2.1 40.8 40.8 0 00-1.8 3.7 54 54 0 00-16.2 0A26.3 26.3 0 0025.4.3a.2.2 0 00-.2-.1A58.4 58.4 0 0010.5 4.9a.2.2 0 00-.1.1C1.6 18.4-.9 31.5.4 44.4a.2.2 0 00.1.1 58.7 58.7 0 0017.7 9 .2.2 0 00.3-.1 42 42 0 003.6-5.9.2.2 0 00-.1-.3 38.7 38.7 0 01-5.5-2.6.2.2 0 01 0-.4c.4-.3.7-.6 1.1-.9a.2.2 0 01.2 0c11.5 5.3 24 5.3 35.4 0a.2.2 0 01.2 0l1.1.9a.2.2 0 010 .4c-1.8 1-3.6 1.9-5.6 2.6a.2.2 0 00-.1.3 47.2 47.2 0 003.7 5.9.2.2 0 00.2.1 58.5 58.5 0 0017.7-9 .2.2 0 00.1-.1c1.5-15.3-2.5-28.3-10.6-39.4a.2.2 0 00-.1-.1zM23.7 36.3c-3.5 0-6.4-3.2-6.4-7.1s2.8-7.1 6.4-7.1 6.5 3.2 6.4 7.1c0 3.9-2.9 7.1-6.4 7.1zm23.6 0c-3.5 0-6.4-3.2-6.4-7.1s2.8-7.1 6.4-7.1 6.5 3.2 6.4 7.1c0 3.9-2.8 7.1-6.4 7.1z" fill="#5865F2"/></svg>
Continue with Discord
</button>
</form>
<div class="login-footer">
Don't have an account? <a href="#" onclick="showRegister();return false">Create one</a>
</div>
</div>
</div>
</div>

<!-- Register Page -->
<div id="registerPage" class="login-page" style="display:none">
<div class="login-container">
<div class="login-card">
<div class="login-logo">
<h1>VexPanel</h1>
<p>Create your account</p>
</div>
<div id="registerError" class="login-error"></div>
<form class="login-form" id="registerForm">
<div class="form-group">
<label>Username</label>
<input type="text" name="username" placeholder="john" required pattern="^[a-zA-Z0-9_-]{3,32}$">
</div>
<div class="form-group">
<label>Email</label>
<input type="email" name="email" placeholder="john@example.com" required>
</div>
<div class="form-group">
<label>Password</label>
<input type="password" name="password" placeholder="Min 12 characters" required minlength="12">
</div>
<button type="submit" class="login-btn">Create Account</button>
</form>
<div class="login-footer">
Already have an account? <a href="#" onclick="showLogin();return false">Sign in</a>
</div>
</div>
</div>
</div>

<!-- Main App -->
<div id="appLayout" class="app-layout" style="display:none">
<aside class="sidebar">
<div class="sidebar-logo">
<div class="sidebar-logo-icon">V</div>
<div class="sidebar-logo-text">Vex<span>Panel</span></div>
</div>
<nav class="sidebar-nav" id="sidebarNav"></nav>
<div class="sidebar-user" id="sidebarUser"></div>
</aside>
<main class="main-content" id="mainContent"></main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
<div class="modal">
<h2 id="modalTitle"></h2>
<p id="modalDesc"></p>
<form class="modal-form" id="modalForm"></form>
<div class="modal-actions">
<button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
<button type="submit" class="btn btn-primary" form="modalForm">Save</button>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const API=session=>fetch(session?{credentials:'include'}:{});
let currentUser=null, currentView='dashboard';

// Auth
function csrf(){return document.cookie.split('; ').find(v=>v.startsWith('csrf='))?.slice(5)}
async function api(path,opt={}){const r=await fetch(path,{credentials:'include',headers:{'content-type':'application/json','x-csrf-token':csrf(),...(opt.headers||{})},...opt});if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||'Request failed');return r.status===204?null:r.json()}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(msg,type='success'){const t=$('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.classList.remove('show'),3000)}
function $(id){return document.getElementById(id)}

async function checkAuth(){
try{
currentUser=await api('/api/me');
showApp();
}catch{
showLogin();
}
}

function showLogin(){
$('loginPage').style.display='';
$('registerPage').style.display='none';
$('appLayout').style.display='none';
}

function showRegister(){
$('loginPage').style.display='none';
$('registerPage').style.display='';
$('appLayout').style.display='none';
}

function showApp(){
$('loginPage').style.display='none';
$('registerPage').style.display='none';
$('appLayout').style.display='';
renderSidebar();
navigate('dashboard');
}

$('loginForm').onsubmit=async e=>{
e.preventDefault();
const fd=new FormData(e.target);
$('loginBtn').disabled=true;
$('loginError').className='login-error';
try{
await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:fd.get('email'),password:fd.get('password'})});
currentUser=await api('/api/me');
showApp();
}catch(err){
$('loginError').textContent=err.message;
$('loginError').className='login-error show';
$('loginBtn').disabled=false;
}
};

$('registerForm').onsubmit=async e=>{
e.preventDefault();
const fd=new FormData(e.target);
try{
await api('/api/auth/register',{method:'POST',body:JSON.stringify({username:fd.get('username'),email:fd.get('email'),password:fd.get('password'})});
currentUser=await api('/api/me');
showApp();
}catch(err){
$('registerError').textContent=err.message;
$('registerError').className='login-error show';
}
};

// Sidebar
const isAdmin=()=>currentUser&&(currentUser.role==='ADMIN'||currentUser.role==='SUPER_ADMIN');
const isSupport=()=>currentUser&&(currentUser.role==='SUPPORT'||currentUser.role==='NODE_MANAGER'||isAdmin());

const adminNav=[
{section:'OVERVIEW',items:[{id:'dashboard',icon:'📊',label:'Dashboard'}]},
{section:'COMPUTE',items:[{id:'vps',icon:'🖥️',label:'All VPS',badge:'vps'},{id:'create-vps',icon:'➕',label:'Create VPS'},{id:'tasks',icon:'⚡',label:'Tasks',badge:'tasks'}]},
{section:'INFRASTRUCTURE',items:[{id:'nodes',icon:'🌐',label:'Nodes'},{id:'ips',icon:'🔗',label:'IPv4 Pool'},{id:'images',icon:'💿',label:'OS Images'}]},

async function logout(){

// Navigation
async function navigate(view){
currentView=view;
renderSidebar();
const c=$('mainContent');
c.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-muted)">Loading...</div>';
try{
if(view==='dashboard')await renderDashboard(c);
else if(view==='vps'&&isAdmin())await renderAllVps(c);
else if(view==='my-vps')await renderMyVps(c);
else if(view==='create-vps')renderCreateVps(c);
else if(view==='tasks')await renderTasks(c);
else if(view==='nodes'&&isAdmin())await renderNodes(c);
else if(view==='ips'&&isAdmin())await renderIps(c);
else if(view==='images'&&isAdmin())await renderImages(c);
else if(view==='plans'&&isAdmin())await renderPlans(c);
else if(view==='users'&&isAdmin())await renderUsers(c);
else if(view==='audit'&&isAdmin())await renderAudit(c);
else if(view==='settings'&&isAdmin())await renderSettings(c);
else if(view==='backups'&&isAdmin())await renderAllBackups(c);
else if(view==='snapshots'&&isAdmin())await renderAllSnapshots(c);
else if(view==='profile')renderProfile(c);
else if(view==='notifications')await renderNotifications(c);
else if(view.startsWith('vps-detail:'))await renderVpsDetail(c,view.split(':')[1]);
else c.innerHTML='<div class="empty-state"><div class="empty-state-icon">🔒</div><h3>Access Denied</h3><p>You don\'t have permission to view this page.</p></div>';
}catch(err){c.innerHTML=`<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>Error</h3><p>${esc(err.message)}</p></div>`}
}

// Create VPS
function renderCreateVps(c){
c.innerHTML=`
<div class="page-header"><h1>Create VPS</h1><p>Deploy a new LXD system container</p></div>
<div class="card" style="max-width:600px"><div class="card-body padded">
<form class="modal-form" id="createVpsForm">
<div class="form-group"><label>VPS Name</label><input name="name" placeholder="My Server" required pattern="^[a-zA-Z0-9 _-]{1,64}$"></div>
<div class="form-group"><label>Hostname</label><input name="hostname" placeholder="my-server" required pattern="^[a-zA-Z0-9-]{1,63}$"></div>
${isAdmin()?'<div class="form-group"><label>User ID</label><input name="userId" placeholder="User CUID" required></div>':'<input type="hidden" name="userId" value="'+currentUser.id+'">'}
<div class="form-group"><label>Operating System</label><select name="imageAlias" id="osSelect"><option value="ubuntu:24.04">Ubuntu 24.04</option><option value="ubuntu:22.04">Ubuntu 22.04</option><option value="debian:12">Debian 12</option></select></div>
<div class="form-group"><label>CPU (vCPU)</label><input name="cpu" type="number" min="1" max="64" value="1"></div>
<div class="form-group"><label>RAM (MB)</label><input name="ramMiB" type="number" min="512" max="524288" value="2048"></div>
<div class="form-group"><label>Disk (GB)</label><input name="diskGiB" type="number" min="5" max="4096" value="25"></div>
<div class="form-group"><label>Expiration (days, 0=never)</label><input name="expiresDays" type="number" min="0" value="30"></div>
<div style="display:flex;gap:16px;margin-top:8px">
<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="checkbox" name="ipv4" checked> IPv4</label>
<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="checkbox" name="sshx" checked> SSHX</label>
<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="checkbox" name="rdp"> RDP</label>
</div>
<button type="submit" class="btn btn-primary" style="margin-top:16px;width:100%">Create VPS</button>
</form>
</div></div>`;
$('createVpsForm').onsubmit=async e=>{
e.preventDefault();
const fd=new FormData(e.target);
const d=Object.fromEntries(fd);
d.cpu=Number(d.cpu);d.ramMiB=Number(d.ramMiB);d.diskGiB=Number(d.diskGiB);
const days=Number(d.expiresDays);delete d.expiresDays;
if(days>0)d.expiresAt=new Date(Date.now()+days*86400000).toISOString();else delete d.expiresAt;
for(const k of['ipv4','rdp','sshx','tailscale'])d[k]=d[k]==='on';
try{await api('/api/vps',{method:'POST',body:JSON.stringify(d)});toast('VPS creating...');navigate('my-vps')}catch(err){toast(err.message,'error')}
};
}

const a=await api('/api/users');
c.innerHTML=`
<div class="page-header" style="display:flex;justify-content:space-between;align-items:start"><div><h1>Users</h1><p>Accounts and roles</p></div><button class="btn btn-primary" onclick="openModal('user')">+ Create User</button></div>
<div class="card"><div class="card-body">
${a.length?`<table class="table"><thead><tr><th>User</th><th>Role</th><th>VPS</th><th>Status</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td><strong>${esc(x.username)}</strong><br><span style="color:var(--text-muted);font-size:11px">${esc(x.email)}</span></td><td><span class="badge badge-online">${x.role}</span></td><td>${x._count?.vpses??0}</td><td>${x.suspendedAt?'<span class="badge badge-stopped">Suspended</span>':'<span class="badge badge-online"><span class="badge-dot"></span>Active</span>'}</td><td><button class="btn btn-secondary btn-sm" onclick="suspendUser('${x.id}',${!x.suspendedAt})">${x.suspendedAt?'Unsuspend':'Suspend'}</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty-state"><div class="empty-state-icon">👥</div><h3>No users</h3></div>`}</div></div>`;

// Profile
function renderProfile(c){
c.innerHTML=`
<div class="page-header"><h1>Profile</h1><p>Manage your account</p></div>
<div class="card" style="max-width:500px"><div class="card-body padded">
<div style="display:flex;align-items:center;gap:16px;margin-bottom:24px">
<div class="sidebar-avatar" style="width:64px;height:64px;font-size:24px;border-radius:16px">${currentUser.username.slice(0,2).toUpperCase()}</div>
<div><h2 style="font-size:18px">${esc(currentUser.username)}</h2><p style="color:var(--text-muted);font-size:13px">${esc(currentUser.email)}</p><span class="badge badge-online" style="margin-top:4px">${currentUser.role}</span></div>
</div>
<form class="modal-form" id="profileForm">
<div class="form-group"><label>Username</label><input name="username" value="${esc(currentUser.username)}" required></div>
<div class="form-group"><label>Email</label><input name="email" type="email" value="${esc(currentUser.email)}" required></div>
<button type="submit" class="btn btn-primary" style="width:100%">Save Changes</button>
</form>
</div></div>
<div class="card" style="max-width:500px;margin-top:16px"><div class="card-header"><h2>Change Password</h2></div><div class="card-body padded">
<form class="modal-form" id="passwordForm">
<div class="form-group"><label>Current Password</label><input name="currentPassword" type="password" required minlength="12"></div>
<div class="form-group"><label>New Password</label><input name="newPassword" type="password" required minlength="12"></div>
<button type="submit" class="btn btn-primary" style="width:100%">Change Password</button>
</form>
</div></div>`;
$('profileForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api('/api/me',{method:'PUT',body:JSON.stringify(d)});currentUser=await api('/api/me');toast('Profile updated');renderSidebar();renderProfile($('mainContent'))}catch(err){toast(err.message,'error')}};

}

<div class="card"><div class="card-body">
${n.length?n.map(x=>`

// Helpers
function statusBadge(s){
const map={RUNNING:'badge-running',STOPPED:'badge-stopped',PROVISIONING:'badge-provisioning',SUSPENDED:'badge-suspended',ERROR:'badge-error',DELETING:'badge-stopped',ONLINE:'badge-online',OFFLINE:'badge-offline',MAINTENANCE:'badge-maintenance',QUEUED:'badge-provisioning',COMPLETED:'badge-running',FAILED:'badge-error',CANCELLED:'badge-stopped',AVAILABLE:'badge-online',ASSIGNED:'badge-running',RESERVED:'badge-maintenance',DISABLED:'badge-stopped',CONNECTED:'badge-online',INSTALLING:'badge-provisioning',RECONNECTING:'badge-maintenance',DISABLED:'badge-stopped'};
return `<span class="badge ${map[s]||'badge-stopped'}"><span class="badge-dot"></span>${s}</span>`;
}

async function vpsAction(id,action){
if(action==='delete'&&!confirm('Delete this VPS permanently?'))return;
try{await api(`/api/vps/${id}/actions`,{method:'POST',body:JSON.stringify({action})});toast(`${action} queued`);setTimeout(()=>navigate(currentView),1000)}catch(err){toast(err.message,'error')}
}

async function suspendUser(id,suspended){
if(!confirm(`${suspended?'Suspend':'Unsuspend'}?`))return;
try{await api(`/api/users/${id}/suspension`,{method:'POST',body:JSON.stringify({suspended})});toast('Updated');navigate('users')}catch(err){toast(err.message,'error')}
}

async function toggleMaintenance(id,enabled){
try{await api(`/api/nodes/${id}/maintenance`,{method:'POST',body:JSON.stringify({enabled})});toast('Updated');navigate('nodes')}catch(err){toast(err.message,'error')}
}

async function reserveIp(id,reserved){
try{await api(`/api/ipv4/${id}/reservation`,{method:'POST',body:JSON.stringify({reserved})});toast('Updated');navigate('ips')}catch(err){toast(err.message,'error')}
}

async function deletePlan(id){
if(!confirm('Delete plan?'))return;
try{await api(`/api/plans/${id}`,{method:'DELETE'});toast('Deleted');navigate('plans')}catch(err){toast(err.message,'error')}
}

async function markRead(id){try{await api(`/api/notifications/${id}/read`,{method:'PUT'});navigate('notifications')}catch{}}
async function markAllRead(){try{await api('/api/notifications/read-all',{method:'PUT'});navigate('notifications')}catch{}}

// Modal
const forms={
node:{title:'Add Node',desc:'Enrollment token shown after creation.',fields:'<div class="form-group"><label>Node Name</label><input name="name" placeholder="node-01" required></div><div class="form-group"><label>Address</label><input name="address" placeholder="10.0.0.1" required></div>',path:'/api/nodes'},
ip:{title:'Add IPv4',desc:'Add an address routed to a node.',fields:'<div class="form-group"><label>Address</label><input name="address" required></div><div class="form-group"><label>Node ID</label><input name="nodeId" required></div>',path:'/api/ipv4'},
image:{title:'Add OS Image',desc:'LXD image alias for provisioning.',fields:'<div class="form-group"><label>Name</label><input name="name" placeholder="Ubuntu 24.04" required></div><div class="form-group"><label>Distribution</label><input name="distribution" value="ubuntu" required></div><div class="form-group"><label>Release</label><input name="release" value="24.04" required></div><div class="form-group"><label>Architecture</label><select name="architecture"><option>amd64</option><option>arm64</option></select></div><div class="form-group"><label>Image Alias</label><input name="imageAlias" value="ubuntu:24.04" required></div>',path:'/api/os-images'},
plan:{title:'Create Plan',desc:'Define resource limits.',fields:'<div class="form-group"><label>Name</label><input name="name" required></div><div class="form-group"><label>vCPU</label><input name="cpu" type="number" min="1" value="1"></div><div class="form-group"><label>RAM (MB)</label><input name="ramMiB" type="number" min="512" value="2048"></div><div class="form-group"><label>Disk (GB)</label><input name="diskGiB" type="number" min="5" value="25"></div><div class="form-group"><label>VPS Limit</label><input name="vpsLimit" type="number" min="1" value="1"></div><div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:8px">${['ipv4','rdp','sshx','backups','tailscale'].map(x=>`<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="checkbox" name="${x}"> ${x}</label>`).join('')}</div>',path:'/api/plans'},
user:{title:'Create User',desc:'Passwords use Argon2id.',fields:'<div class="form-group"><label>Email</label><input name="email" type="email" required></div><div class="form-group"><label>Username</label><input name="username" required></div><div class="form-group"><label>Password</label><input name="password" type="password" minlength="12" required></div><div class="form-group"><label>Role</label><select name="role"><option value="USER">User</option><option value="SUPPORT">Support</option><option value="ADMIN">Admin</option></select></div>',path:'/api/users'},
};

function openModal(kind){
const f=forms[kind];
$('modalTitle').textContent=f.title;
$('modalDesc').textContent=f.desc;
$('modalForm').innerHTML=f.fields;
$('modalOverlay').classList.add('show');
$('modalForm').onsubmit=async e=>{
e.preventDefault();
const d=Object.fromEntries(new FormData(e.target));
for(const k of['cpu','ramMiB','diskGiB','vpsLimit'])if(k in d)d[k]=Number(d[k]);
for(const k of['ipv4','rdp','sshx','backups','tailscale'])d[k]=d[k]==='on';
try{await api(f.path,{method:'POST',body:JSON.stringify(d)});closeModal();toast('Saved');navigate(currentView)}catch(err){toast(err.message,'error')}
};
}
function closeModal(){$('modalOverlay').classList.remove('show')}

// Init
checkAuth();
</script>
